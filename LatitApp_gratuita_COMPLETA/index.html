<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <title>Latitanti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://eumostwanted.eu">
    <link rel="preconnect" href="https://en.wikipedia.org">
    <link rel="dns-prefetch" href="https://eumostwanted.eu">
    <link rel="dns-prefetch" href="https://en.wikipedia.org">
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --page: #e9edf4;
            --card: #ffffff;
            --ink: #1c2233;
            --ink-2: #616b83;
            --ink-3: #8790a5;
            --line: #e8ecf3;
            --accent: #4f6bed;
            --accent-soft: #e9edff;
            --dot: #ef6f5e;
            --dot-off: #dfe4ee;
            --ph: linear-gradient(160deg, #e8edfc, #dbe3f7);
            --shadow: 0 1px 2px rgba(28, 34, 51, .04), 0 8px 24px rgba(28, 34, 51, .05);
            --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --tab-h: 62px;
            --ease: cubic-bezier(.22, .8, .2, 1);
        }

        /* Tema chiaro fisso */
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --page: #e9edf4;
            --card: #ffffff;
            --ink: #1c2233;
            --ink-2: #616b83;
            --ink-3: #8790a5;
            --line: #e8ecf3;
            --accent: #4f6bed;
            --accent-soft: #e9edff;
            --dot: #ef6f5e;
            --dot-off: #dfe4ee;
            --ph: linear-gradient(160deg, #e8edfc, #dbe3f7);
            --shadow: 0 1px 2px rgba(28, 34, 51, .04), 0 8px 24px rgba(28, 34, 51, .05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            background: var(--page);
        }

        body {
            background: var(--page);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 8px;
        }

        [hidden] {
            display: none !important;
        }

        .app {
            max-width: none;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--bg);
            padding-bottom: calc(var(--tab-h) + 34px + env(safe-area-inset-bottom, 0px));
        }

        

        /* Intestazione */
        .bar {
            position: sticky;
            top: 0;
            z-index: 20;
            padding-top: env(safe-area-inset-top, 0px);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            view-transition-name: bar;
        }

        .bar-in {
            height: 72px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bar h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 8px 14px 8px 8px;
            border-radius: 999px;
            background: var(--card);
            box-shadow: var(--shadow);
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
        }

        .back svg {
            width: 18px;
            height: 18px;
        }

        .sort {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px 8px 14px;
            border-radius: 999px;
            background: var(--card);
            box-shadow: var(--shadow);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-2);
        }

        .sort>svg {
            width: 14px;
            height: 14px;
            transition: transform .2s ease;
        }

        .sort[data-dir="asc"]>svg,
        .sort[aria-expanded="true"]>svg {
            transform: rotate(180deg);
        }

        /* Menu di ordinamento (Arrestati) */
        .sortwrap {
            position: relative;
        }

        .menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            z-index: 40;
            min-width: 196px;
            padding: 6px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 10px 32px rgba(28, 34, 51, .14), 0 0 0 1px rgba(28, 34, 51, .04);
        }

        .menu button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 10px 12px 10px 14px;
            border-radius: 14px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-2);
        }

        .menu button+button {
            margin-top: 2px;
        }

        .menu button.is-on {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .menu button svg {
            width: 14px;
            height: 14px;
            opacity: 0;
        }

        .menu button.is-on svg {
            opacity: 1;
        }

        .menu .sep {
            height: 1px;
            margin: 6px 10px;
            background: var(--line);
        }
        .news-filter-menu { min-width: 210px; }
        .news-custom { padding: 8px 8px 6px; border-top: 1px solid var(--line); margin-top: 4px; }
        .news-custom label { display:block; margin:7px 4px; color:var(--ink-3); font-size:11px; font-weight:600; }
        .news-custom input { display:block; width:100%; margin-top:5px; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); font:inherit; font-size:12px; }
        .news-apply { width:100%; margin-top:8px; padding:9px 12px; border-radius:12px; background:var(--accent-soft); color:var(--accent); font:inherit; font-size:12px; font-weight:600; }


        .view {
            display: none;
        }

        .view.is-active {
            display: block;
        }

        /* Elenco */
        .list {
            list-style: none;
            padding: 4px 16px 8px;
            display: grid;
            gap: 12px;
        }

        .item {
            background: var(--card);
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .row {
            width: 100%;
            display: grid;
            grid-template-columns: 68px 1fr 14px;
            gap: 16px;
            align-items: center;
            text-align: left;
            padding: 12px 18px 12px 12px;
            border-radius: 22px;
            transition: transform .15s ease;
        }

        .row:active {
            transform: scale(.985);
        }

        .thumb {
            width: 68px;
            height: 84px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--ph);
        }

        .thumb img,
        .thumb .ph {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            object-fit: cover;
            object-position: center 20%;
        }

        .ph {
            color: #7f93d6;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: .02em;
        }

        .badge-op {
            width: 68px;
            height: 84px;
            border-radius: 16px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .badge-op b {
            display: block;
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
        }

        .badge-op i {
            display: block;
            margin-top: 5px;
            font-size: 9px;
            font-weight: 600;
            font-style: normal;
            text-transform: uppercase;
            letter-spacing: .03em;
            color: var(--ink-2);
        }

        .cover-op {
            width: min(260px, calc(100% - 32px));
            aspect-ratio: 5 / 2;
            margin: 8px auto 0;
            border-radius: 20px;
            background: var(--ph);
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--accent);
        }

        .cover-op b {
            display: block;
            font-size: 54px;
            font-weight: 700;
            line-height: 1;
        }

        .cover-op span {
            display: block;
            margin-top: 6px;
            font-size: 15px;
            font-weight: 500;
            color: var(--ink-2);
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .nm {
            display: block;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .rt {
            display: block;
            margin-top: 3px;
            font-size: 13.5px;
            color: var(--ink-2);
            line-height: 1.35;
        }

        html.nascondi-pallini .dots {
            display: none;
        }

        .dots {
            display: inline-flex;
            gap: 5px;
            margin-top: 10px;
        }

        .dots i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--dot-off);
            display: block;
        }

        .dots i.on {
            background: var(--dot);
        }

        .chev {
            width: 14px;
            height: 14px;
            color: var(--ink-3);
        }

        .foot {
            padding: 12px 26px 24px;
            color: var(--ink-3);
            font-size: 12.5px;
        }

        /* Scheda */
        .cover {
            width: min(230px, calc(100% - 32px));
            aspect-ratio: 4 / 5;
            margin: 8px auto 0;
            border-radius: 24px;
            overflow: hidden;
            background: var(--ph);
        }

        .cover img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 22%;
        }

        .cover .ph {
            height: 100%;
            display: grid;
            place-items: center;
            font-size: 42px;
        }

        .scheda-body {
            padding: 22px 16px 32px;
        }

        .scheda-body .head {
            padding: 0 4px;
        }

        .scheda-body .nm {
            font-size: 30px;
            letter-spacing: -0.025em;
        }

        .alias {
            display: block;
            margin-top: 2px;
            color: var(--ink-2);
            font-size: 15px;
        }

        .scheda-body .dots {
            margin-top: 14px;
        }

        .dots-l {
            margin-left: 10px;
            font-size: 12.5px;
            color: var(--ink-3);
            vertical-align: 1px;
        }

        .ruolo {
            margin: 18px 4px 0;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        .fatti {
            list-style: none;
            margin: 16px 4px 0;
            display: grid;
            gap: 10px;
        }

        .fatti li {
            position: relative;
            padding-left: 18px;
            font-size: 15px;
            line-height: 1.5;
            color: var(--ink);
        }

        .fatti li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: .58em;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .nota {
            margin-top: 18px;
            padding: 13px 16px;
            border-radius: 16px;
            background: var(--accent-soft);
            color: var(--ink-2);
            font-size: 13.5px;
            line-height: 1.5;
        }

        /* Tabelle */
        .tbl,
        .mappa {
            margin-top: 14px;
            padding: 16px 18px 6px;
            background: var(--card);
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .tbl h3,
        .mappa h3 {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--ink-3);
            letter-spacing: .01em;
        }

        .tbl dl {
            margin-top: 6px;
        }

        .tbl dl>div {
            display: grid;
            grid-template-columns: 118px 1fr;
            column-gap: 14px;
            align-items: baseline;
            padding: 12px 0;
        }

        .tbl dl>div+div {
            border-top: 1px solid var(--line);
        }

        .tbl dt {
            font-size: 13.5px;
            color: var(--ink-2);
        }

        .tbl dd {
            font-size: 14.5px;
            font-weight: 500;
            line-height: 1.4;
        }

        .tbl dd.long {
            font-weight: 400;
        }

        /* Mappa */
        .mappa {
            padding-bottom: 18px;
        }

        .mappa .dove {
            margin-top: 8px;
            font-size: 14.5px;
            line-height: 1.45;
        }

        .mappa .frame {
            margin-top: 14px;
            aspect-ratio: 4 / 3;
            border-radius: 16px;
            overflow: hidden;
            background: var(--ph);
        }

        .mappa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .apri {
            margin-top: 12px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .apri {
            cursor: pointer;
        }

        .apri svg {
            width: 18px;
            height: 18px;
        }

        .nota-m {
            margin-top: 12px;
            font-size: 12.5px;
            line-height: 1.5;
            color: var(--ink-3);
        }

        /* Sezioni in arrivo */
        .soon {
            padding: 4px 24px;
            color: var(--ink-3);
        }

        /* Impostazioni */
/* Barra in basso, fluttuante */
        .tabbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            padding: 0 0 calc(12px + env(safe-area-inset-bottom, 0px));
            pointer-events: none;
            view-transition-name: tabbar;
        }

        .tabbar-in {
            pointer-events: auto;
            width: 100%;
            max-width: none;
            margin: 0;
            height: var(--tab-h);
            padding: 0;
            gap: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: color-mix(in srgb, var(--card) 92%, transparent);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-radius: 0;
            box-shadow: 0 10px 32px rgba(28, 34, 51, .12), 0 0 0 1px rgba(28, 34, 51, .04);
        }

        .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: var(--ink-3);
            transition: background .2s ease, color .2s ease;
        }

        .tab svg {
            width: 24px;
            height: 24px;
        }

        .tab.is-active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        /* Transizione tra elenco e scheda (l'intestazione e la barra restano ferme) */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: .4s;
            animation-timing-function: var(--ease);
            animation-fill-mode: both;
            mix-blend-mode: normal;
        }

        html[data-nav="forward"]::view-transition-old(root) {
            animation-name: vt-out-left;
        }

        html[data-nav="forward"]::view-transition-new(root) {
            animation-name: vt-in-right;
        }

        html[data-nav="back"]::view-transition-old(root) {
            animation-name: vt-out-right;
        }

        html[data-nav="back"]::view-transition-new(root) {
            animation-name: vt-in-left;
        }

        @keyframes vt-in-right {
            from {
                transform: translateX(100%);
            }
        }

        @keyframes vt-out-left {
            to {
                transform: translateX(-28%);
                opacity: .35;
            }
        }

        @keyframes vt-in-left {
            from {
                transform: translateX(-28%);
                opacity: .35;
            }
        }

        @keyframes vt-out-right {
            to {
                transform: translateX(100%);
            }
        }

        /* Se il browser non supporta la transizione sopra, la scheda entra comunque con uno scorrimento */
        .view.in-forward {
            animation: fb-right .4s var(--ease) both;
        }

        .view.in-back {
            animation: fb-left .4s var(--ease) both;
        }

        @keyframes fb-right {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
        }

        @keyframes fb-left {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }

            .view.in-forward,
            .view.in-back {
                animation: none;
            }

            ::view-transition-group(*),
            ::view-transition-old(*),
            ::view-transition-new(*) {
                animation: none !important;
            }
        }

        /* NEWS — feed editoriale minimal, coerente con il resto dell'app */
        #v-news { padding: 0 16px 20px; }
        .news-wrap { max-width: 760px; margin: 0 auto; }
        .news-intro { padding: 2px 4px 14px; }
        .news-kicker { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
        .news-sub { margin-top: 4px; color: var(--ink-2); font-size: 13px; }
        .news-list { list-style:none; display:grid; gap:10px; }
        .news-sections { display:grid; gap:18px; }
        .news-section { display:grid; gap:9px; }
        .news-section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:0 4px; }
        .news-section-title { margin:0; font-size:14px; font-weight:650; letter-spacing:-.01em; color:var(--ink); }
        .news-section-count { color:var(--ink-3); font-size:11px; white-space:nowrap; }
        .news-empty { padding:13px 14px; border:1px dashed var(--line); border-radius:14px; color:var(--ink-3); background:var(--card); font-size:12px; line-height:1.4; }
        .news-card { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
        .news-card button { width:100%; text-align:left; padding:15px 15px 14px; display:block; }
        .news-card button:active { transform:scale(.995); }
        .news-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
        .news-tag { display:inline-flex; align-items:center; min-height:24px; padding:4px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:600; }
        .news-date { color:var(--ink-3); font-size:11px; white-space:nowrap; }
        .news-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
        .news-title-row .news-title { flex:1; min-width:0; }
        .news-title-row .news-date { flex:0 0 auto; padding-top:2px; }
        .news-title { font-size:16px; line-height:1.25; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
        .news-summary { margin-top:6px; color:var(--ink-2); font-size:13px; line-height:1.45; }
        .news-meta { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:10px; color:var(--ink-3); font-size:11px; }
        .news-source { color:var(--ink-2); font-weight:500; }
        .news-detail { padding:0 15px 15px; border-top:1px solid var(--line); }
        .news-detail[hidden] { display:none; }
        .news-detail p { margin-top:11px; color:var(--ink-2); font-size:13px; line-height:1.55; }
        .news-facts { margin:10px 0 0 17px; color:var(--ink-2); font-size:13px; line-height:1.55; }
        .news-facts li+li { margin-top:5px; }
        .news-link { display:inline-flex; margin-top:12px; color:var(--accent); font-size:12px; font-weight:600; text-decoration:none; }
        .news-link:hover { text-decoration:underline; }
        .news-empty { padding:28px 12px; text-align:center; color:var(--ink-3); font-size:13px; }
        @media (min-width:700px) { #v-news { padding-left:20px; padding-right:20px; } .news-list { gap:12px; } .news-card button { padding:17px 18px 16px; } }
    
        .news-live-status { display:inline-flex; align-items:center; gap:6px; margin:0 4px 10px; color:var(--ink-3); font-size:10px; }
        .news-live-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }
</style>
</head>

<body>

    <div class="app">

        <header class="bar">
            <div class="bar-in">
                <button class="back" id="indietro" type="button" hidden>
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.5 4.5L7 10l5.5 5.5" />
                    </svg>
                    <span id="indietro-l">Latitanti</span>
                </button>
                <h1 id="titolo">Latitanti</h1>
                <button class="sort" id="ordina" type="button" data-dir="desc" aria-label="Ordine: prima i più pericolosi">
                    <span id="ordina-l">Più pericolosi</span>
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 8l5 5 5-5" />
                    </svg>
                </button>
                <div class="sortwrap" id="ordina-a-wrap" hidden>
                    <button class="sort" id="ordina-a" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Ordina gli arrestati">
                        <span id="ordina-a-l">Più pericolosi</span>
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 8l5 5 5-5" />

            {data:"2025-10-16",categoria:"Operazione",titolo:"Foggia: sequestrati 4 milioni di beni a un imprenditore",sintesi:"La DIA ha comunicato un sequestro patrimoniale nei confronti di un imprenditore del settore automotive.",dettagli:["Il valore indicato dalla DIA è di circa 4 milioni di euro.","Il comunicato è inserito nell'archivio ufficiale del 16 ottobre 2025.","L'attività rientra nelle misure patrimoniali di contrasto alla criminalità organizzata."],fonte:"Direzione Investigativa Antimafia",url:"https://direzioneinvestigativaantimafia.interno.gov.it/category/comunicatistampa/"},
            {data:"2025-10-15",categoria:"Operazione",titolo:"Operazione Bononia Gate della DIA di Bologna",sintesi:"Operazione della Direzione Investigativa Antimafia pubblicata il 15 ottobre 2025.",dettagli:["Il nome dell'operazione è Bononia Gate.","La notizia è registrata nell'archivio dei comunicati DIA.","Il procedimento e le contestazioni vanno letti sulla base degli atti dell'autorità giudiziaria."],fonte:"Direzione Investigativa Antimafia",url:"https://direzioneinvestigativaantimafia.interno.gov.it/category/comunicatistampa/"},
            {data:"2025-10-01",categoria:"Operazione",titolo:"Confiscati circa 6 milioni a una coppia della famiglia mafiosa barcellonese",sintesi:"La DIA ha comunicato la confisca di beni riconducibili a una coppia appartenente alla famiglia mafiosa barcellonese.",dettagli:["Il valore indicato è di circa 6 milioni di euro.","Il provvedimento è datato 1 ottobre 2025.","La notizia proviene dall'archivio ufficiale della Direzione Investigativa Antimafia."],fonte:"Direzione Investigativa Antimafia",url:"https://direzioneinvestigativaantimafia.interno.gov.it/category/comunicatistampa/"}
        ];

        const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        } [c]));
        const iniziali = p => (p.nome[0] + p.cognome[0]).toUpperCase();

        function eta(iso) {
            const n = new Date(iso),
                o = new Date();
            let a = o.getFullYear() - n.getFullYear();
            if (o < new Date(o.getFullYear(), n.getMonth(), n.getDate())) a--;
            return a;
        }
        /* Età a una data precisa (es. il giorno dell'arresto) */
        function etaAl(nato, rif) {
            const [y1, m1, d1] = nato.split("-").map(Number);
            const [y2, m2, d2] = rif.split("-").map(Number);
            let a = y2 - y1;
            if (m2 < m1 || (m2 === m1 && d2 < d1)) a--;
            return a;
        }


        const NEWS_SEZIONI = [
            {
                key: "operazioni",
                titolo: "Operazioni",
                categorie: ["Operazione", "Blitz"]
            },
            {
                key: "nuovi-latitanti",
                titolo: "Latitanti",
                categorie: ["Nuovi latitanti", "Latitanti"]
            },
            {
                key: "identikit",
                titolo: "Identikit",
                categorie: ["Identikit"]
            },
        ];

        function luogoNews(n) {
            const t = `${n.luogo || ""} ${n.titolo} ${n.sintesi} ${(n.dettagli || []).join(" ")}`;
            const luoghi = [
                { nomi:["Caivano","Casoria","Napoli","Giugliano in Campania"], citta:"Napoli", regione:"Campania" },
                { nomi:["Lecce"], citta:"Lecce", regione:"Puglia" },
                { nomi:["Brindisi"], citta:"Brindisi", regione:"Puglia" },
                { nomi:["Bari"], citta:"Bari", regione:"Puglia" },
                { nomi:["Manfredonia","Foggia"], citta:"Foggia", regione:"Puglia" },
                { nomi:["Roma","Latina"], citta:"Roma", regione:"Lazio" },
                { nomi:["Trento"], citta:"Trento", regione:"Trentino-Alto Adige" },
                { nomi:["Palermo"], citta:"Palermo", regione:"Sicilia" },
                { nomi:["Catania","Giarre"], citta:"Catania", regione:"Sicilia" },
                { nomi:["Comiso"], citta:"Comiso", regione:"Sicilia" },
                { nomi:["Genova"], citta:"Genova", regione:"Liguria" },
                { nomi:["Bologna","Bononia"], citta:"Bologna", regione:"Emilia-Romagna" },
                { nomi:["Salerno","Avellino","Potenza"], citta:"Salerno", regione:"Campania" },
                { nomi:["Vibo Valentia"], citta:"Vibo Valentia", regione:"Calabria" },
                { nomi:["Matera"], citta:"Matera", regione:"Basilicata" },
                { nomi:["Paraguay","Perù"], citta:"Estero", regione:"Estero" }
            ];
            const low = t.toLowerCase();
            for (const gruppo of luoghi) {
                if (gruppo.nomi.some(x => low.includes(x.toLowerCase()))) return `${gruppo.citta}, ${gruppo.regione}`;
            }
            return "Italia";
        }

        function etichettaNews(n) {
            const oggi = dataISO(new Date());
            if (n.data === oggi) return "Oggi";
            if (n.categoria === "Blitz") return "Maxi Blitz";
            if (n.categoria === "Arresti") return "Arresti";
            if (n.categoria === "Identikit") return "Identikit";
            return "Aggiornamento";
        }

        function sottotitoloNews(n) {
            return `<strong>${esc(luogoNews(n))}</strong> ${esc(n.sintesi)}`;
        }

        let filtroNews = "all";
        let newsCustomFrom = "";
        let newsCustomTo = "";

        function dataISO(d) {
            const x = new Date(d);
            return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
        }

        function newsInFiltro(n) {
            if (filtroNews === "all") return true;
            const oggi = new Date();
            oggi.setHours(0,0,0,0);
            const data = new Date(n.data + "T00:00:00");
            data.setHours(0,0,0,0);
            if (filtroNews === "today") return data.getTime() === oggi.getTime();
            if (filtroNews === "7" || filtroNews === "30") {
                const giorni = Number(filtroNews);
                const inizio = new Date(oggi);
                inizio.setDate(oggi.getDate() - (giorni - 1));
                return data >= inizio && data <= oggi;
            }
            if (filtroNews === "custom") {
                if (newsCustomFrom && n.data < newsCustomFrom) return false;
                if (newsCustomTo && n.data > newsCustomTo) return false;
                return true;
            }
            return true;
        }

        function labelFiltroNews() {
            if (filtroNews === "today") return "Oggi";
            if (filtroNews === "7") return "Ultimi 7 giorni";
            if (filtroNews === "30") return "Ultimo mese";
            if (filtroNews === "custom") return "Personalizzato";
            return "Tutte";
        }

        // News automatiche: vengono caricate da news.json quando l'app è pubblicata online.
        // Se il file viene aperto localmente e news.json non è disponibile, resta attivo l'archivio incorporato.
        let LIVE_NEWS = [];
        function tutteLeNews() {
            const base = [...NEWS];
            const map = new Map();
            [...LIVE_NEWS, ...base].forEach(n => {
                const key = n.url || `${n.data}|${n.titolo}`;
                if (!map.has(key)) map.set(key, n);
            });
            return [...map.values()].sort((a,b) => (b.data || '').localeCompare(a.data || ''));
        }
        async function caricaNewsAutomatiche() {
            try {
                const r = await fetch(`news.json?ts=${Date.now()}`, { cache: 'no-store' });
                if (!r.ok) return;
                const dati = await r.json();
                if (!Array.isArray(dati)) return;
                LIVE_NEWS = dati.filter(n => n && n.data && n.titolo && n.url);
                renderNews();
            } catch (_) {
                // Apertura locale (file://) o rete assente: nessun errore visibile.
            }
        }

        function renderNews() {
            const el = $("news-sections");
            if (!el) return;
            const elencoNews = tutteLeNews();
            const filtrate = elencoNews.filter(newsInFiltro);
            const oggiPiano = new Date();
            oggiPiano.setHours(0,0,0,0);
            const inizioPiano = new Date(oggiPiano);
            inizioPiano.setDate(oggiPiano.getDate() - 6);
            const primoPiano = elencoNews.filter(n => {
                const d = new Date(n.data + "T00:00:00");
                d.setHours(0,0,0,0);
                return d >= inizioPiano && d <= oggiPiano;
            });
            const cardNews = (n, secKey) => {
                const i = elencoNews.indexOf(n);
                return `
                    <article class="news-card" data-news="${i}">
                        <button type="button" aria-expanded="false">
                            ${secKey === "operazioni" ? `<div class="news-top"><span class="news-tag">${esc(etichettaNews(n))}</span><time class="news-date" datetime="${esc(n.data)}">${esc(dataEstesa(n.data))}</time></div><h2 class="news-title">${esc(n.titolo)}</h2>` : `<div class="news-title-row"><h2 class="news-title">${esc(n.titolo)}</h2><time class="news-date" datetime="${esc(n.data)}">${esc(dataEstesa(n.data))}</time></div>`}
                            <p class="news-summary">${sottotitoloNews(n)}</p>
                            <div class="news-meta"><span class="news-source">${esc(n.fonte)}</span><span>Dettagli</span></div>
                        </button>
                        <div class="news-detail" hidden>
                            <ul class="news-facts">${n.dettagli.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
                            ${n.url ? `<a class="news-link" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">Apri la fonte ↗</a>` : ""}
                        </div>
                    </article>`;
            };
            const primoPianoSection = `
                <section class="news-section news-featured" aria-label="Primo piano">
                    <div class="news-section-head">
                        <h2 class="news-section-title">Primo piano</h2>
                        <span class="news-section-count">ultimi 7 giorni</span>
                    </div>
                    <div class="news-list">${primoPiano.length ? primoPiano.map(n => cardNews(n, "operazioni")).join("") : `<div class="news-empty">Nessuna notizia negli ultimi 7 giorni.</div>`}</div>
                </section>`;
            el.innerHTML = primoPianoSection + NEWS_SEZIONI.map(sec => {
                const items = filtrate.filter(n => sec.categorie.includes(n.categoria));
                const cards = items.map(n => cardNews(n, sec.key)).join("");
                return `
                    <section class="news-section" aria-label="${esc(sec.titolo)}">
                        <div class="news-section-head">
                            <h2 class="news-section-title">${esc(sec.titolo)}</h2>
                            <span class="news-section-count">${items.length} ${items.length === 1 ? "notizia" : "notizie"}</span>
                        </div>
                        <div class="news-list">${cards || `<div class="news-empty">Nessuna notizia nel periodo selezionato.</div>`}</div>
                    </section>`;
            }).join("");
            $("filtro-news-l").textContent = labelFiltroNews();
            document.querySelectorAll("#menu-news button[data-filter]").forEach(b => {
                const on = b.dataset.filter === filtroNews;
                b.classList.toggle("is-on", on);
                b.setAttribute("aria-checked", String(on));
            });
        }

        $("v-news")?.addEventListener("click", e => {
            const btn = e.target.closest(".news-card > button");
            if (!btn) return;
            const card = btn.parentElement, detail = card.querySelector(".news-detail");
            const open = detail.hidden;
            document.querySelectorAll(".news-detail").forEach(x => x.hidden = true);
            document.querySelectorAll(".news-card > button").forEach(x => x.setAttribute("aria-expanded", "false"));
            detail.hidden = !open;
            btn.setAttribute("aria-expanded", String(open));
        });

        function dataEstesa(iso) {
            const [y, m, d] = iso.split("-").map(Number);
            return `${d === 1 ? "1°" : d} ${MESI[m - 1]} ${y}`;
        }

        function immagine(p) {
            const fonti = Array.isArray(p.foto) ? p.foto.filter(Boolean) : (p.foto ? [p.foto] : []);
            if (!fonti.length) return `<span class="ph" aria-hidden="true">${esc(iniziali(p))}</span>`;
            const [prima, ...altre] = fonti;
            return `<img src="${esc(prima)}" alt="Foto segnaletica di ${esc(p.nome)} ${esc(p.cognome)}" data-ini="${esc(iniziali(p))}" data-altre="${esc(JSON.stringify(altre))}" referrerpolicy="no-referrer" loading="lazy" decoding="async">`;
        }
        /* Se una foto non si carica prova la successiva, poi mostra le iniziali */
        document.addEventListener("error", e => {
            const el = e.target;
            if (el.tagName !== "IMG" || !el.dataset.ini) return;
            let altre = [];
            try {
                altre = JSON.parse(el.dataset.altre || "[]");
            } catch (_) {}
            if (altre.length) {
                el.src = altre.shift();
                el.dataset.altre = JSON.stringify(altre);
                return;
            }
            const s = document.createElement("span");
            s.className = "ph";
            s.setAttribute("aria-hidden", "true");
            s.textContent = el.dataset.ini;
            el.replaceWith(s);
        }, true);

        function pallini(n) {
            let h = "";
            for (let i = 1; i <= 5; i++) h += `<i class="${i <= n ? "on" : ""}"></i>`;
            return `<span class="dots" role="img" aria-label="Pericolosità ${n} su 5">${h}</span>`;
        }
        const riga = (k, v, lungo) => `<div><dt>${esc(k)}</dt><dd${lungo ? ' class="long"' : ""}>${esc(v || "–")}</dd></div>`;

        const CHEV = `<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5"/></svg>`;
        const rigaLista = (p, i, sintesi) => `
    <li class="item">
      <button class="row" type="button" data-i="${i}">
        <span class="thumb">${immagine(p)}</span>
        <span>
          <span class="nm">${esc(p.nome)} ${esc(p.cognome)}</span>
          ${sintesi ? `<span class="rt">${esc(sintesi)}</span>` : ""}
          ${pallini(p.pericolosita || 1)}
        </span>
        ${CHEV}
      </button>
    </li>`;

        let dir = "desc";
        let ord = [];
        let scrollLista = 0;
        let origine = "latitanti";
        let corrente = null;

        function renderLista() {
            ord = [...LATITANTI].sort((a, b) => dir === "desc" ? (b.pericolosita || 1) - (a.pericolosita || 1) : (a.pericolosita || 1) - (b.pericolosita || 1));
            $("lista").innerHTML = ord.map((p, i) => rigaLista(p, i, p.sintesi)).join("");
        }

        /* Arrestati: due criteri indipendenti (pericolosità e data d'arresto).
           L'ultimo scelto conta di più; l'altro decide a parità. */
        const LAB_A = {
            pericolo: {
                desc: "Più pericolosi",
                asc: "Meno pericolosi"
            },
            data: {
                desc: "Più recenti",
                asc: "Meno recenti"
            }
        };
        const CMP_A = {
            pericolo: (a, b) => (a.pericolosita || 1) - (b.pericolosita || 1),
            data: (a, b) => a.arresto.localeCompare(b.arresto)
        };
        let selA = {
            pericolo: "desc",
            data: "desc"
        }; // null = criterio non attivo
        let primA = "pericolo"; // ultimo criterio toccato = principale
        let ordA = [];

        function renderArrestati() {
            const sec = primA === "pericolo" ? "data" : "pericolo";
            const attivi = [primA, sec].filter(k => selA[k]);
            const segno = k => selA[k] === "desc" ? -1 : 1;
            ordA = [...ARRESTATI].sort((x, y) => {
                for (const k of attivi) {
                    const c = segno(k) * CMP_A[k](x, y);
                    if (c) return c;
                }
                return 0;
            });
            $("lista-a").innerHTML = ordA.map((p, i) => rigaLista(p, i, `Arrestato il ${dataEstesa(p.arresto)}`)).join("");
            $("ordina-a-l").textContent = attivi.length ? attivi.map(k => LAB_A[k][selA[k]]).join("  ·  ") : "Ordina";
            $("ordina-a").setAttribute("aria-label", attivi.length ? "Ordine: " + attivi.map(k => LAB_A[k][selA[k]]).join(", ") : "Ordina gli arrestati");
  document.querySelectorAll("#menu-a button").forEach(b => {
    const [g, d] = b.dataset.k.split("-");
    const on = selA[g] === d;
    b.classList.toggle("is-on", on);
    b.setAttribute("aria-checked", String(on));
  });
}

const rigaListaOp = (o, i) => `
    <li class="item">
      <button class="row" type="button" data-i="${i}">
        <span class="badge-op"><b>${esc(String(o.numeroArresti))}</b><i>arresti</i></span>
        <span>
          <span class="nm">${esc(o.nome)}</span>
          <span class="rt">${esc(dataEstesa(o.data))} · ${esc(o.org)}</span>
        </span>
        ${CHEV}
      </button>
    </li>`;

/* Operazioni: stessi due criteri indipendenti degli arrestati (arresti e data) */
const LAB_O = {
  arresti: { desc: "Più arresti", asc: "Meno arresti" },
  data:    { desc: "Più recenti", asc: "Meno recenti" }
};
const CMP_O = {
  arresti: (a, b) => a.numeroArresti - b.numeroArresti,
  data:    (a, b) => a.data.localeCompare(b.data)
};
let selO = { arresti: "desc", data: "desc" };
let primO = "arresti";
let ordO = [];

function renderOperazioni() {
  const sec = primO === "arresti" ? "data" : "arresti";
  const attivi = [primO, sec].filter(k => selO[k]);
  const segno = k => selO[k] === "desc" ? -1 : 1;
  ordO = [...OPERAZIONI].sort((x, y) => {
    for (const k of attivi) { const c = segno(k) * CMP_O[k](x, y); if (c) return c; }
    return 0;
  });
  $("lista-o").innerHTML = ordO.map((o, i) => rigaListaOp(o, i)).join("");
  $("ordina-o-l").textContent = attivi.length ? attivi.map(k => LAB_O[k][selO[k]]).join("  ·  ") : "Ordina";
  $("ordina-o").setAttribute("aria-label", attivi.length ? "Ordine: " + attivi.map(k => LAB_O[k][selO[k]]).join(", ") : "Ordina le operazioni");
  document.querySelectorAll("#menu-o button").forEach(b => {
    const [g, d] = b.dataset.k.split("-");
    const on = selO[g] === d;
    b.classList.toggle("is-on", on);
    b.setAttribute("aria-checked", String(on));
  });
}
function menuO(aperto) {
  $("menu-o").hidden = !aperto;
  $("ordina-o").setAttribute("aria-expanded", String(aperto));

        /* Foto: per latitanti e arrestati usa le foto locali/remote già indicate
           e aggiunge automaticamente la foto principale della relativa pagina Wikipedia. */
        async function caricaFotoWiki() {
            const dati = [...LATITANTI, ...ARRESTATI];
            await Promise.all(dati.filter(p => p.wiki && !(Array.isArray(p.foto) && p.foto.length)).map(async p => {
                try {
                    const [lang, titolo] = p.wiki.split(":");
                    const endpoint = `https://${lang}.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=640&redirects=1&format=json&origin=*&titles=${encodeURIComponent(titolo)}`;
                    const r = await fetch(endpoint, { cache: "force-cache" });
                    if (!r.ok) return;
                    const pagine = (await r.json()).query.pages;
                    const src = ((Object.values(pagine)[0] || {}).thumbnail || {}).source;
                    if (src && !(p.foto || []).includes(src)) p.foto.push(src);
                } catch (_) {}
            }));
            renderLista();
            renderArrestati();
        }

        /* Precarica le foto in sordina, a bassa priorità: non rallenta l'apertura
           dell'app, ma quando tocchi un nome la foto è già in cache. */
        function precaricaFoto() {
            [...LATITANTI, ...ARRESTATI].forEach(p => {
                const url = Array.isArray(p.foto) ? p.foto[0] : p.foto;
                if (!url) return;
                const img = new Image();
                if ("fetchPriority" in img) img.fetchPriority = "low";
                img.referrerPolicy = "no-referrer";
                img.src = url;
            });
        }
        const avvia = () => (window.requestIdleCallback ? requestIdleCallback(precaricaFoto, {
            timeout: 2000
        }) : setTimeout(precaricaFoto, 300));
        if (document.readyState === "complete") avvia();
        else window.addEventListener("load", avvia);

<script>
async function caricaNewsAutomatiche() {
  try {
    const risposta = await fetch('./news.json?t=' + Date.now(), {
      cache: 'no-store'
    });

    if (!risposta.ok) {
      throw new Error('news.json non disponibile');
    }

    const news = await risposta.json();

    console.log('News automatiche caricate:', news);

    /*
     * Rende disponibili le news automatiche all'app.
     * Se l'app usa già una variabile news, la aggiorniamo.
     */
    window.newsAutomatiche = news;

    if (typeof renderNews === 'function') {
      renderNews(news);
    }

  } catch (errore) {
    console.error('Errore caricamento news:', errore);
  }
}

caricaNewsAutomatiche();
